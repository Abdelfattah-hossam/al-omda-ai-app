name: Cloudflare PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish isolated preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check preview credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare PR Preview skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
            {
              echo "### Cloudflare PR Preview"
              echo "Preview was skipped because Cloudflare repository credentials are not configured."
              echo "Required CI, typecheck, build, and tests remain authoritative."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out pull request
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        if: steps.credentials.outputs.available == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Set up Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build application
        if: steps.credentials.outputs.available == 'true'
        run: pnpm run build

      - name: Publish Cloudflare Worker Preview
        if: steps.credentials.outputs.available == 'true'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          WORKER_NAME: al-omda-ai-app
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.161.0 preview --config artifacts/al-omda-ai/wrangler.jsonc --name "$PREVIEW_NAME" --message "Preview for PR #${{ github.event.pull_request.number }}" 2>&1 | tee /tmp/preview.log
          mapfile -t preview_urls < <(sed -nE "s|^Preview URL: (https://\${PREVIEW_NAME}-\${WORKER_NAME}[.][A-Za-z0-9-]+[.]workers[.]dev)$|\\1|p" /tmp/preview.log | sort -u)
          if [ "${#preview_urls[@]}" -ne 1 ]; then
            echo "Expected exactly one workers.dev Preview URL containing $PREVIEW_NAME; found ${#preview_urls[@]}."
            exit 1
          fi
          echo "url=${preview_urls[0]}" >> "$GITHUB_OUTPUT"

      - name: Add or update preview link on pull request
        if: steps.credentials.outputs.available == 'true' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- al-omda-cloudflare-preview -->';
            const body = [
              marker,
              '## Al Omda live preview',
              '',
              'Preview URL: ' + process.env.PREVIEW_URL,
              '',
              'This is an isolated Cloudflare Worker Preview. It does not replace the production Worker.',
              'Preview settings do not inherit production variables or secrets. API-backed features remain unavailable until Preview-specific secrets and test resources are configured.'
            ].join('\\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
