name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.sender.type != 'Bot' && ((github.event_name == 'issue_comment' && github.event.issue.pull_request) || (github.event_name == 'pull_request' && !github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run PR-Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.LLM_API_KEY }}
          OPENAI__API_BASE: ${{ secrets.OPENROUTER_API_KEY && 'https://openrouter.ai/api/v1' || secrets.LLM_BASE_URL }}
          config.model: openai/${{ secrets.OPENROUTER_API_KEY && (secrets.OPENROUTER_MODEL || 'openrouter/free') || secrets.LLM_MODEL }}
          config.fallback_models: '[]'
          config.custom_model_max_tokens: "32000"
          config.num_retries: "2"
          github_action_config.auto_review: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          github_action_config.feedback_on_draft_pr: "false"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          pr_reviewer.extra_instructions: "Review only the pull request diff. Report only verifiable defects with file paths, line references, impact, and a concise fix. Prioritize security, authentication and authorization, data integrity, concurrency, error handling, accessibility, and missing regression tests. Do not modify code or create commits."
