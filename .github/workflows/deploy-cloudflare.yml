name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/al-omda-ai/**"
      - "artifacts/api-server/**"
      - "lib/**"
      - "artifacts/al-omda-ai/wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Deploy canonical Pages frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node artifacts/al-omda-ai/build/prepare-pages.mjs
          # Canonical Zahin project (created on first deploy) and the legacy
          # project, whose worker 301-redirects pages to zahin.pages.dev while
          # keeping its /api proxy alive for stale clients.
          pnpm dlx wrangler@4.161.0 pages project create zahin --production-branch main || true
          pnpm dlx wrangler@4.161.0 pages deploy artifacts/al-omda-ai/dist/public --project-name zahin --branch main
          PAGES_HOST_MODE=legacy node artifacts/al-omda-ai/build/prepare-pages.mjs
          pnpm dlx wrangler@4.161.0 pages deploy artifacts/al-omda-ai/dist/public --project-name al-omda-ai --branch main

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -f artifacts/al-omda-ai/dist/public/_worker.js artifacts/al-omda-ai/dist/public/_routes.json
          pnpm dlx wrangler@4.161.0 deploy --config artifacts/al-omda-ai/wrangler.jsonc --keep-vars
