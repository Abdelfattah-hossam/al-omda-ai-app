name: Deploy temporary AL OMDA preview

on:
  push:
    branches:
      - preview/shareable-demo
    paths:
      - "artifacts/al-omda-ai/**"
      - "artifacts/api-server/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-preview.yml"

permissions:
  contents: read

concurrency:
  group: al-omda-shareable-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build and deploy isolated preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.161.0 deploy --config artifacts/al-omda-ai/wrangler.jsonc --name al-omda-preview --workers-dev
