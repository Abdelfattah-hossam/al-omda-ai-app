name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: antongulin/robin/.github/workflows/review.yml@main
    with:
      agent-mode: off
      review-on-synchronize: true
    secrets:
      # Prefer OpenRouter when its repository secret is configured; otherwise keep Gemini.
      # OPENROUTER_MODEL is optional and defaults to the free router.
      LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.OPENROUTER_API_KEY && 'https://openrouter.ai/api/v1' || secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.OPENROUTER_API_KEY && (secrets.OPENROUTER_MODEL || 'openrouter/free') || secrets.LLM_MODEL }}
