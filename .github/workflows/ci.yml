name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test local Agent utilities
        run: pnpm --filter @workspace/scripts test
      - name: Test chat intent classification
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/chat-intent.test.ts
      - name: Test project intent classification
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/project-intent.test.ts
      - name: Test chat Agent stream parser
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/agent-stream.test.ts
      - name: Test API CORS policy
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/app.cors.test.ts

      - name: Set up reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0

      - name: Typecheck, annotate changed lines, and build application
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm run typecheck 2>&1 | tee /tmp/typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          set -e

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reviewdog -efm='%f(%l,%c): error TS%*[0-9]: %m' -name='TypeScript' -reporter=github-pr-check -filter-mode=added < /tmp/typecheck.log
          fi

          if [ "$typecheck_status" -ne 0 ]; then
            exit "$typecheck_status"
          fi

          pnpm --filter @workspace/al-omda-ai run build
