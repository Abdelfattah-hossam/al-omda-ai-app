name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test local Agent utilities
        run: pnpm --filter @workspace/scripts test
      - name: Test chat intent classification
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/chat-intent.test.ts
      - name: Test new task plan validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/task-plan-validation.test.ts
      - name: Test detailed project plan validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/project-plan.test.ts
      - name: Test hosted model quality and temperature policy
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/ai-model-policy.test.ts
      - name: Test AI provider failover chain
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/provider-failover.test.ts
      - name: Test execution tool registry (fetch_url)
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/execution-tools.test.ts
      - name: Test Office file text extraction (read_workspace_asset)
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/office-reader.test.ts
      - name: Test write-tool approval gate (save_step_result_file)
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/write-tools.test.ts
      - name: Test private memory graph validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/memory-graph.test.ts
      - name: Test chat history artifact and warning persistence
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/routes/chat-history.test.ts
      - name: Test source-code artifact validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/source-code-artifact.test.ts
      - name: Test Excel workbook validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/excel-workbook.test.ts
      - name: Test PowerPoint presentation validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/powerpoint-presentation.test.ts
      - name: Test generated HTML app artifact policy
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/html-app-artifact.test.ts
      - name: Test multi-file code project artifact validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/code-project-artifact.test.ts
      - name: Test multi-file project intent classification
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/project-code-intent.test.ts
      - name: Test ZIP project packaging
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/zip.test.ts
      - name: Test generated Office files
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/office-ooxml.test.ts
      - name: Test slide image parsing
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/slide-image.test.ts
      - name: Test sales CSV parsing and asset matching
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/sales-csv.test.ts
      - name: Test Excel formula cell preservation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/office-formula-cell.test.ts
      - name: Test workspace asset upload MIME normalization
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/asset-upload.test.ts
      - name: Test iOS-aware file download helper
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/download-file.test.ts
      - name: Test Word document validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/word-document.test.ts
      - name: Test professional legal and engineering standards
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/professional-standards.test.ts
      - name: Test Office artifact text normalization
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/office-artifact-text.test.ts
      - name: Test Office OOXML package validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/ooxml-validation.test.ts
      - name: Test project intent classification
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/project-intent.test.ts
      - name: Test bounded chat context and cross-device sync
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/chat-context.test.ts
      - name: Test chat Agent stream parser
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/al-omda-ai/src/lib/agent-stream.test.ts
      - name: Test API CORS policy
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/app.cors.test.ts
      - name: Test collaboration record validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/routes/collaboration.test.ts
      - name: Test workspace asset validation
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/storage-assets.test.ts
      - name: Test workspace response sanitization
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/workspace-sanitize.test.ts
      - name: Test sequential project stage prerequisites
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/lib/project-stage-sequence.test.ts
      - name: Test Supabase schema security and quota contracts
        run: pnpm --filter @workspace/scripts exec tsx --test ../supabase/setup.test.ts

      - name: Set up reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0

      - name: Typecheck, annotate changed lines, and build application
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pnpm run typecheck 2>&1 | tee /tmp/typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          set -e

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reviewdog -efm='%f(%l,%c): error TS%*[0-9]: %m' -name='TypeScript' -reporter=github-pr-check -filter-mode=added < /tmp/typecheck.log
          fi

          if [ "$typecheck_status" -ne 0 ]; then
            exit "$typecheck_status"
          fi

          pnpm --filter @workspace/al-omda-ai run build
