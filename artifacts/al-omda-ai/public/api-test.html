<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اختبار اتصال العمدة API</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#101114;color:#f4f4f5;padding:24px;max-width:680px;margin:40px auto}
    main{background:#1b1c21;border:1px solid #343640;border-radius:16px;padding:22px}
    h1{font-size:22px}p{color:#c4c4cc}
    pre{direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;background:#090a0c;padding:16px;border-radius:10px;color:#d9f5df}
    button{background:#e7c77b;color:#171717;border:0;border-radius:9px;padding:12px 18px;font-weight:700;font-size:16px}
    #status{font-weight:700;margin:18px 0}
  </style>
</head>
<body>
  <main>
    <h1>اختبار اتصال العمدة API</h1>
    <p>الصفحة دي بتبعت طلب مباشر للسيرفر وتعرض الرد، من غير ما تغيّر أي إعدادات.</p>
    <button id="test">اختبر الاتصال الآن</button>
    <div id="status">لم يبدأ الاختبار بعد</div>
    <pre id="result">في انتظار الاختبار...</pre>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    document.getElementById('test').addEventListener('click', async () => {
      statusEl.textContent = 'جاري الاتصال...';
      resultEl.textContent = '';
      try {
        const response = await fetch('/api/healthz', {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });
        const body = await response.text();
        statusEl.textContent = 'HTTP ' + response.status + (response.ok ? ' — تم استلام رد' : ' — رد بخطأ');
        resultEl.textContent = body;
      } catch (error) {
        statusEl.textContent = 'فشل الاتصال';
        resultEl.textContent = String(error);
      }
    });
    document.getElementById('test').click();
  </script>
</body>
</html>
