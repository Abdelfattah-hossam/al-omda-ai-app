<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; media-src data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>معاينة</title>
<script>
// Sandboxed preview target: the app posts preview HTML here with postMessage.
// The main page CSP blocks inline scripts in srcdoc iframes (they inherit the
// parent policy), so interactive previews live in this dedicated document with
// its own relaxed-but-offline CSP. Only the framing page may inject HTML.
window.addEventListener("message", function (event) {
  if (window.parent === window) return;
  if (event.source !== window.parent) return;
  var data = event.data;
  if (!data || data.type !== "munjizly-preview" || typeof data.html !== "string") return;
  document.open();
  document.write(data.html);
  document.close();
});
</script>
</head>
<body style="margin:0;background:#fff"></body>
</html>
